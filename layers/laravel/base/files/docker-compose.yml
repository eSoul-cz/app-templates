services:
    laravel:
        build:
            context: './'
            dockerfile: ./docker/dev/Dockerfile
            args:
                WWWUSER: '${WWWUSER:-1000}'
                WWWGROUP: '${WWWGROUP:-1000}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-5173}:5173'
        expose:
            - 9000
        env_file:
            - .env
        # The application talks to the MariaDB service below; a plain .env keeps SQLite for work outside Docker.
        environment:
            LARAVEL_SAIL: 1
            VITE_PORT: '${VITE_PORT:-5173}'
            DB_CONNECTION: mariadb
            DB_HOST: mariadb
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE:-laravel}'
            DB_USERNAME: '${DB_USERNAME:-laravel}'
            DB_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - '.:/var/www'
        networks:
            - dev
        depends_on:
            mariadb:
                condition: service_healthy
    nginx:
        image: 'nginx:alpine'
        ports:
            - '${APP_PORT:-8080}:80'
        volumes:
            - './docker/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
            - '.:/var/www'
        networks:
            - dev
        depends_on:
            - laravel
    mariadb:
        image: 'mariadb:12.3'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MARIADB_DATABASE: '${DB_DATABASE:-laravel}'
            MARIADB_USER: '${DB_USERNAME:-laravel}'
            MARIADB_PASSWORD: '${DB_PASSWORD:-secret}'
            MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-secret}'
        volumes:
            - 'mariadb:/var/lib/mysql'
        networks:
            - dev
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
networks:
    dev:
        driver: bridge
volumes:
    mariadb:
        driver: local
