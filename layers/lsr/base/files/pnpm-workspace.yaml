# pnpm 12 reads only registry authentication from `.npmrc`; every other pnpm setting lives in this file.
# Hoisted to the root node_modules so that tools and editors resolve `@inertiajs/core` (a dependency of @inertiajs/vue3).
publicHoistPattern:
    - '@inertiajs/core'
# Dependencies whose install scripts may run; any other package with one fails the install
# (`ERR_PNPM_IGNORED_BUILDS`) until it is listed here (`pnpm approve-builds`).
allowBuilds:
    '@parcel/watcher': true
    '@tailwindcss/oxide': true
    esbuild: true
    vue-demi: true
